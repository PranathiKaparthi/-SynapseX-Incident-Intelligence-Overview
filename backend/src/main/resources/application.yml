server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: synapsex-backend
  profiles:
    default: dev
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/synapsex}
    username: ${SPRING_DATASOURCE_USERNAME:synapsex}
    password: ${SPRING_DATASOURCE_PASSWORD:synapsex_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:synapsex-consumer-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.records: 500
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

synapsex:
  jwt:
    secret: ${SYNAPSEX_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${SYNAPSEX_JWT_EXPIRATION_MS:900000} # 15 minutes
    refresh-expiration-ms: ${SYNAPSEX_JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  ai:
    provider: ${SYNAPSEX_AI_PROVIDER:demo}
    api-key: ${SYNAPSEX_AI_API_KEY:}
    model: ${SYNAPSEX_AI_MODEL:gpt-4o}
    base-url: ${SYNAPSEX_AI_BASE_URL:https://api.openai.com/v1}
  ingestion:
    rate-limit-per-second: 1000
    burst-capacity: 2000
    max-body-bytes: 5242880 # 5MB
    max-batch-size: 500
