server:
  port: 8080

spring:
  application:
    name: synapsex-backend-dev
  datasource:
    url: jdbc:h2:mem:synapsex_dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console
  kafka:
    listener:
      auto-startup: false
  data:
    redis:
      repositories:
        enabled: false

synapsex:
  kafka:
    listener:
      auto-startup: false
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 900000
    refresh-expiration-ms: 604800000
  ai:
    provider: demo
  ingestion:
    rate-limit-per-second: 1000
    burst-capacity: 2000
    max-body-bytes: 5242880
    max-batch-size: 500
